# Optional Render Blueprint for the frontend static site.
# If you create services manually in Render, add the same route in:
# Static Site -> Redirects/Rewrites -> Source /* -> Destination /index.html -> Action Rewrite.
services:
  - type: web
    runtime: static
    name: lexflow-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
