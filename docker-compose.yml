# ============================================================
# LEXFLOW — docker-compose.yml
# ============================================================
# Services:
#   db            PostgreSQL + pgvector
#   redis         Celery broker + cache
#   backend       FastAPI API process only
#   celery_worker Celery worker process only
#   frontend      React SPA served by nginx
#
# Usage:
#   Development  →  docker compose up --build
#                   (runs: db, redis, backend, celery | no frontend by default)
#
#   With frontend →  docker compose --profile frontend up --build
#                    (adds frontend nginx to dev)
# ============================================================

services:

  # ── PostgreSQL + pgvector ─────────────────────────────────
  db:
    image: ankane/pgvector:latest
    container_name: lexflow_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-lexflow_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis (Celery broker + result backend + cache) ─────────
  redis:
    image: redis:7-alpine
    container_name: lexflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend (API only) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lexflow-backend:latest
    container_name: lexflow_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      APP_ENV: development
      ENVIRONMENT: development
      LEXFLOW_PROCESS_MODE: api
      RUN_MIGRATIONS_ON_STARTUP: "true"
      RUN_SEED_ON_STARTUP: "true"
      UVICORN_RELOAD: "true"
      DOCUMENT_PROCESSING_MODE: celery
      ENABLE_TEST_UPLOAD_BYPASS: "true"
    volumes:
      - ./backend:/app/backend
    working_dir: /app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery worker (background processing only) ─────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lexflow-celery:latest
    container_name: lexflow_celery
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      APP_ENV: development
      ENVIRONMENT: development
      LEXFLOW_PROCESS_MODE: worker
      RUN_MIGRATIONS_ON_STARTUP: "false"
      RUN_SEED_ON_STARTUP: "false"
      CELERY_CONCURRENCY: "4"
      CELERY_POOL: threads
      CELERY_QUEUES: default,documents,ai,celery
    volumes:
      - ./backend:/app/backend
    working_dir: /app/backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping --destination celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── React frontend (nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: lexflow-frontend:latest
    container_name: lexflow_frontend
    restart: unless-stopped
    profiles: ["frontend"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Named volumes ─────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
